name: Inject selectable minigames

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add games menu script to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="games-menu.js"></script>'
          if marker not in s:
              s=s.replace('</body>', marker+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injected script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: load selectable minigame menu"
          git push
