name: Remove floating decorative assets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-floats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure floating assets are disabled
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="remove-floating-assets.js" defer></script>'
          if marker not in s:
              anchor = '<script src="andina-image-fix.js" defer></script>'
              if anchor in s:
                  s = s.replace(anchor, anchor + '\n' + marker, 1)
              else:
                  s = s.replace('</body>', marker + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: disable all floating decorative assets"
          git push
