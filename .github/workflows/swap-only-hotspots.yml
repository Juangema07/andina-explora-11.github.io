name: Ajustar solo coordenadas de Eje y Páramo

on:
  push:
    paths:
      - '.github/workflows/swap-only-hotspots.yml'

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Intercambiar únicamente las coordenadas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('andina-games-fix.js')
          s = p.read_text(encoding='utf-8')
          old_paramo = "{id:'paramo',name:'Páramo',tag:'alta montaña · agua · biodiversidad',image:images.paramo,\n  hotspot:'left:61.2%;top:7.5%;width:18%;height:10.4%;',"
          new_paramo = "{id:'paramo',name:'Páramo',tag:'alta montaña · agua · biodiversidad',image:images.paramo,\n  hotspot:'left:31.5%;top:33.3%;width:18%;height:10.4%;',"
          old_cafe = "{id:'cafe',name:'Eje Cafetero',tag:'montañas · café · paisaje cultural',image:images.cafe,\n  hotspot:'left:31.5%;top:33.3%;width:18%;height:10.4%;',"
          new_cafe = "{id:'cafe',name:'Eje Cafetero',tag:'montañas · café · paisaje cultural',image:images.cafe,\n  hotspot:'left:61.2%;top:7.5%;width:18%;height:10.4%;',"
          if old_paramo not in s or old_cafe not in s:
              raise SystemExit('Las coordenadas actuales no coinciden; no se hizo ningún cambio.')
          s = s.replace(old_paramo, new_paramo, 1).replace(old_cafe, new_cafe, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add andina-games-fix.js .github/workflows/swap-only-hotspots.yml
          git commit -m 'Intercambiar solo coordenadas de Eje Cafetero y Páramo'
          git rm .github/workflows/swap-only-hotspots.yml
          git commit -m 'Eliminar ajuste temporal de coordenadas'
          git push
