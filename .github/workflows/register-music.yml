name: Registrar música

on:
  push:
    paths:
      - 'music/*.mp3'
      - 'tools/register_music.py'
      - '.github/workflows/register-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Generar catálogo
        run: python tools/register_music.py

      - name: Guardar catálogo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music/music.json
          git diff --cached --quiet || git commit -m 'Update music catalog'
          git push
