name: Apply guide coverage
on:
  push:
    branches: [main]
    paths:
      - 'guia-cobertura-andina.js'
      - 'guia-cobertura-andina.css'
      - '.github/workflows/apply-guide-coverage.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject guide coverage assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="guia-cobertura-andina.css?v=20260916-1">'
          js='<script src="guia-cobertura-andina.js?v=20260916-1" defer></script>'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>')
          if js not in s:
              s=s.replace('</body>', js+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: apply guide coverage to main page'
          git push
