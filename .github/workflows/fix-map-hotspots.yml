name: Fix map hotspot positions

on:
  push:
    paths:
      - '.github/workflows/fix-map-hotspots.yml'
      - 'andina-games-fix.js'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar posiciones y fondos de los recuadros
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('andina-games-fix.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "hotspot:'left:34.4%;top:33.3%;width:18%;height:10.4%;'": "hotspot:'left:31.5%;top:33.3%;width:18%;height:10.4%;'",
              "hotspot:'left:61.2%;top:7.5%;width:18.6%;height:14%;'": "hotspot:'left:61.2%;top:7.5%;width:18%;height:10.4%;'",
              "image:images.cafe,\n  hotspot:'left:31.5%;top:33.3%;width:18%;height:10.4%;'": "image:images.paramo,\n  hotspot:'left:31.5%;top:33.3%;width:18%;height:10.4%;'",
              "image:images.paramo,\n  hotspot:'left:61.2%;top:7.5%;width:18%;height:10.4%;'": "image:images.cafe,\n  hotspot:'left:61.2%;top:7.5%;width:18%;height:10.4%;'"
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Publicar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add andina-games-fix.js
          if git diff --cached --quiet; then
            echo 'Sin cambios'
          else
            git commit -m 'Ajuste puntual de botones Andina [skip ci]'
            git push
          fi
