name: Intercambiar contenido de Eje Cafetero y Páramo

on:
  push:
    paths:
      - '.github/workflows/fix-map-hotspots.yml'
      - 'andina-games-fix.js'

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Intercambiar regiones sin mover sus posiciones
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('andina-games-fix.js')
          s=p.read_text(encoding='utf-8')
          cafe=re.search(r"(?ms)^ \{id:'cafe'.*?(?=^ \{id:'paramo')", s)
          paramo=re.search(r"(?ms)^ \{id:'paramo'.*?(?=^ \{id:'bogota')", s)
          if not cafe or not paramo:
              raise SystemExit('No se encontraron los bloques Eje Cafetero y Páramo')
          cafe_block=cafe.group(0)
          paramo_block=paramo.group(0)
          s=s[:cafe.start()]+paramo_block+cafe_block+s[paramo.end():]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add andina-games-fix.js
          git commit -m 'Intercambiar contenido de Eje Cafetero y Páramo [skip ci]' || true
          git push
