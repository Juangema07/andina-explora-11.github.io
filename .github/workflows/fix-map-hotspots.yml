name: Swap Eje Cafetero y Páramo

on:
  push:
    paths:
      - '.github/workflows/fix-map-hotspots.yml'
      - 'andina-games-fix.js'

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Intercambiar posiciones de los botones
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('andina-games-fix.js')
          s=p.read_text(encoding='utf-8')
          a="hotspot:'left:31.5%;top:33.3%;width:18%;height:10.4%;'"
          b="hotspot:'left:61.2%;top:7.5%;width:18%;height:10.4%;'"
          marker='__SWAP_HOTSPOT__'
          s=s.replace(a, marker, 1).replace(b, a, 1).replace(marker, b, 1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add andina-games-fix.js
          git commit -m 'Intercambiar botones Eje Cafetero y Páramo [skip ci]' || true
          git push