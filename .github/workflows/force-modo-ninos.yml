name: Force mode switch integration
on:
  push:
    branches: [main]
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Integrate mode files directly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('legacy-enhancements.js?v=20260914-2','legacy-enhancements.js?v=20260916-3')
          if 'modo-ninos.css?v=20260916-2' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="modo-ninos.css?v=20260916-2">\n</head>')
          if 'modo-ninos.js?v=20260916-2' not in s:
              s=s.replace('</body>','<script src="modo-ninos.js?v=20260916-2" defer></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Integrate normal and children modes directly"
          git push
