name: Apply games and mobile fixes
on:
  push:
    paths:
      - 'andina-games-fix.js'
      - 'mobile-fixes.css'
      - '.github/workflows/apply-games-fix.yml'
      - '.github/workflows/Mapa.png'
      - '.github/workflows/Bogota fondo.png'
      - '.github/workflows/zona cafetera fondo.png'
      - '.github/workflows/Paramos fondo.png'
      - '.github/workflows/Valle del cauca fondo.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move game images to a public website folder
        run: |
          mkdir -p assets/andina
          cp '.github/workflows/Mapa.png' 'assets/andina/mapa.png'
          cp '.github/workflows/Bogota fondo.png' 'assets/andina/bogota.png'
          cp '.github/workflows/zona cafetera fondo.png' 'assets/andina/eje-cafetero.png'
          cp '.github/workflows/Paramos fondo.png' 'assets/andina/paramo.png'
          cp '.github/workflows/Valle del cauca fondo.png' 'assets/andina/valle-del-cauca.png'
      - name: Ensure fix assets are loaded after the main app
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          game='<script src="andina-games-fix.js" defer></script>'
          s=s.replace('<script src="andina-games-fix.js"></script>', game)
          if game not in s:
              marker='<script src="app.js" defer></script>'
              s=s.replace(marker, marker+'\n'+game) if marker in s else s.replace('</body>', game+'\n</body>')
          css='<link rel="stylesheet" href="mobile-fixes.css">'
          if css not in s:
              marker='<link rel="stylesheet" href="styles.css">'
              s=s.replace(marker, marker+'\n'+css) if marker in s else s.replace('</head>', css+'\n</head>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html andina-games-fix.js assets/andina
          git diff --cached --quiet || git commit -m 'Publish Andina game images for GitHub Pages [skip ci]'
          git push