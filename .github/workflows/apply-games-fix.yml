name: Apply games and mobile fixes
on:
  push:
    paths:
      - 'andina-games-fix.js'
      - 'andina-image-fix.js'
      - 'mobile-fixes.css'
      - '.github/workflows/apply-games-fix.yml'
      - '.github/workflows/Mapa.png'
      - '.github/workflows/Bogota fondo.png'
      - '.github/workflows/zona cafetera fondo.png'
      - '.github/workflows/Paramos fondo.png'
      - '.github/workflows/Valle del cauca fondo.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move game images to a public website folder
        run: |
          mkdir -p assets/andina
          cp '.github/workflows/Mapa.png' 'assets/andina/mapa.png'
          cp '.github/workflows/Bogota fondo.png' 'assets/andina/bogota.png'
          cp '.github/workflows/zona cafetera fondo.png' 'assets/andina/eje-cafetero.png'
          cp '.github/workflows/Paramos fondo.png' 'assets/andina/paramo.png'
          cp '.github/workflows/Valle del cauca fondo.png' 'assets/andina/valle-del-cauca.png'
          touch .nojekyll
      - name: Harden game image URLs and map hotspots
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('andina-games-fix.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const asset=(name)=>({primary:PAGES_BASE+name+'?v=20260912',fallback:RAW_BASE+name+'?v=20260912'});", "const asset=(name)=>({primary:RAW_BASE+name+'?v=20260912',fallback:PAGES_BASE+name+'?v=20260912'});")
          replacements={
            "hotspot:'left:2.1%;top:19.7%;width:11.7%;height:6.2%;'":"hotspot:'left:2.2%;top:29.8%;width:18%;height:9.4%;'",
            "hotspot:'left:19.6%;top:21.7%;width:11.8%;height:6.8%;'":"hotspot:'left:34.4%;top:33.3%;width:18%;height:10.4%;'",
            "hotspot:'left:40%;top:4.9%;width:12.1%;height:9.3%;'":"hotspot:'left:61.2%;top:7.5%;width:18.6%;height:14%;'",
            "hotspot:'left:51%;top:30.5%;width:12%;height:6.3%;'":"hotspot:'left:78.2%;top:46.8%;width:18.2%;height:9.6%;'"
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          p=Path('andina-image-fix.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const good=local(files.map);", "const good=raw(files.map);")
          s=s.replace("img.src=good;", "img.src=good;")
          s=s.replace("panel.style.backgroundImage=`url(\"${local(file)}\"),url(\"${raw(file)}\")`;", "panel.style.backgroundImage=`url(\"${raw(file)}\"),url(\"${local(file)}\")`;")
          s=s.replace("probe.src=local(file);", "probe.src=raw(file);")
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for src in ('andina-games-fix.js','andina-image-fix.js'):
              tag=f'<script src="{src}" defer></script>'
              s=s.replace(f'<script src="{src}"></script>','')
              s=s.replace(tag,'')
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html andina-games-fix.js andina-image-fix.js assets/andina .nojekyll
          git diff --cached --quiet || git commit -m 'Fix Andina map and background images [skip ci]'
          git push
