name: Validar sitio Andina

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4

      - name: Validar JavaScript actual
        run: |
          node --check app.js
          node --check andina-games-fix.js
          node --check andina-image-fix.js

      - name: Validar referencias locales
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          refs=re.findall(r'<script[^>]+src=[\"\']([^\"\']+)[\"\']',html)
          refs += re.findall(r'<link[^>]+href=[\"\']([^\"\']+\.css(?:\?[^\"\']*)?)[\"\']',html)
          clean=[r.split('?',1)[0] for r in refs]
          missing=[r for r in clean if not r.startswith(('http://','https://','//')) and not Path(r).exists()]
          if missing:
              raise SystemExit('Referencias locales inexistentes: '+', '.join(missing))
          print('Referencias locales OK')

      - name: Comprobar imágenes Andina
        run: |
          test -s assets/andina/mapa.png
          test -s assets/andina/bogota.png
          test -s assets/andina/eje-cafetero.png
          test -s assets/andina/paramo.png
          test -s assets/andina/valle-del-cauca.png
          echo 'Las 5 imágenes existen y tienen contenido.'
