<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Andina Explora · Presentación</title><style>:root{--green:#173c31;--gold:#e7bd45;--bg:#080b09;--line:#303a35;--text:#f5f4ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.app{height:100dvh;width:100%;display:grid;grid-template-rows:50px 1fr 50px;background:#080b09}.app.menu-hidden{grid-template-rows:1fr}.app.menu-hidden .topbar,.app.menu-hidden .bottom{display:none}.topbar{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--green);border-bottom:1px solid rgba(255,255,255,.15);z-index:20}.brand{font-weight:900;letter-spacing:.06em;font-size:.85rem}.top-actions{display:flex;gap:6px}.tool{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.09);color:#fff;border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.75rem}.workspace{position:relative;min-height:0;display:grid;grid-template-columns:170px 1fr;background:#050705}.workspace.no-thumbs{grid-template-columns:1fr}.thumbs{min-width:0;overflow:auto;background:#151b18;border-right:1px solid var(--line);padding:8px}.thumbs.hidden{display:none}.thumb{display:flex;align-items:center;gap:8px;width:100%;border:2px solid transparent;border-radius:7px;background:#252b28;color:#fff;padding:10px 8px;margin:0 0 8px;cursor:pointer;font-weight:800;text-align:left}.thumb.active{border-color:var(--gold);background:#303b35}.thumb-num{font-size:13px;min-width:28px;text-align:center;color:var(--gold)}.thumb-label{font-size:12px}.stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#111713;padding:0 48px}.workspace.no-thumbs .stage{padding:0 20px}.slide-wrap{position:relative;width:100%;height:100%;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}.pdf-frame{width:100%;height:100%;border:0;background:#fff;display:block}.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:72px;border:0;border-radius:10px;background:#080d0be8;color:#fff;font-size:44px;cursor:pointer;z-index:8}#prev{left:4px}#next{right:4px}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#101511;z-index:15;font-weight:800}.loading-box{text-align:center}.spinner{width:30px;height:30px;border:4px solid #ffffff33;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}.message{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:25px;z-index:30}.message div{max-width:520px;background:#f3ead8;color:#17231e;padding:24px;border-radius:15px}.bottom{display:flex;align-items:center;justify-content:center;gap:6px;background:#151b18;border-top:1px solid var(--line);z-index:20}.bottom button{height:36px;min-width:36px;border:1px solid #46524c;background:#252d29;color:#fff;border-radius:8px;font-size:19px;cursor:pointer}.page-info{min-width:80px;text-align:center;font-weight:800;font-size:.82rem}.bottom .tool{height:36px}#thumbToggle{min-width:145px;background:#2d3a34;border-color:var(--gold)}#menuToggle{min-width:145px;background:#31453d;border-color:var(--gold)}.menu-fab{position:absolute;right:16px;bottom:14px;z-index:25;display:none;border:1px solid var(--gold);background:#173c31ee;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:0 5px 20px #0008}.app.menu-hidden .menu-fab{display:block}.presentation-fallback{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:99999!important}.presentation-fallback .stage{padding:0 16px!important}.presentation-fallback .workspace.no-thumbs .stage{padding:0 10px!important}@media(max-width:700px){.app{grid-template-rows:45px 1fr 50px}.app.menu-hidden{grid-template-rows:1fr}.topbar{padding:4px 6px}.brand{font-size:.56rem}.top-actions{gap:3px}.tool{font-size:.55rem;padding:6px 7px}.top-actions .tool:last-child{display:none}.thumbs{display:none!important}.workspace,.workspace.no-thumbs{grid-template-columns:1fr}.stage,.workspace.no-thumbs .stage{padding:0 28px}.navbtn{width:32px;height:52px;font-size:29px}#prev{left:2px}#next{right:2px}.bottom{gap:3px}.bottom button{min-width:32px;height:34px;font-size:16px}.page-info{min-width:58px;font-size:.68rem}.bottom .tool{min-width:38px;width:auto;padding:5px 7px;font-size:.62rem!important}#thumbToggle,#menuToggle{min-width:38px}.menu-fab{right:8px;bottom:8px;padding:8px 10px;font-size:.72rem}}@media(min-width:701px){.app:fullscreen{grid-template-rows:52px 1fr 54px}.app:fullscreen.menu-hidden{grid-template-rows:1fr}.app:fullscreen .stage{padding:0 22px}.app:fullscreen .workspace.no-thumbs .stage{padding:0 8px}.app:fullscreen .navbtn{width:56px;height:84px;font-size:50px}}</style></head><body><div class="app" id="app"><header class="topbar"><div class="brand">ANDINA <b>EXPLORA</b> · PRESENTACIÓN</div><div class="top-actions"><a class="tool" href="index.html">← Volver</a><button class="tool" id="full" type="button">⛶ Pantalla completa</button><a class="tool" href="presentacion-andina.pdf" target="_blank" rel="noopener">PDF ↗</a></div></header><section class="workspace" id="workspace"><aside class="thumbs" id="thumbs" aria-label="Lista de páginas"></aside><main class="stage" id="stage"><div class="loading" id="loading"><div class="loading-box"><div class="spinner"></div><div id="loadingText">Abriendo presentación…</div><div class="fallback-note">Preparando el visor</div></div></div><div class="message" id="message"><div><h2>La presentación no pudo cargarse aquí</h2><p>El archivo está en la web. Ábrelo directamente para verlo con el visor de PDF de tu dispositivo.</p><a class="tool" href="presentacion-andina.pdf" target="_blank" rel="noopener">Abrir presentación</a></div></div><button class="navbtn" id="prev" aria-label="Página anterior">‹</button><div class="slide-wrap"><iframe id="pdfFrame" class="pdf-frame" title="Presentación Región Andina" src="about:blank"></iframe></div><button class="navbtn" id="next" aria-label="Página siguiente">›</button><button class="menu-fab" id="menuFab" type="button">☰ Mostrar menú</button></main></section><footer class="bottom"><button id="first" aria-label="Primera página">⏮</button><button id="back" aria-label="Anterior">←</button><div class="page-info"><span id="page">1</span> / <span id="total">—</span></div><button id="forward" aria-label="Siguiente">→</button><button id="last" aria-label="Última página">⏭</button><button id="zoomOut" aria-label="Alejar">−</button><button id="zoomIn" aria-label="Acercar">+</button><button id="thumbToggle" class="tool" type="button">▣ Ocultar páginas</button><button id="menuToggle" class="tool" type="button">☰ Ocultar menú</button></footer></div><script>(function(){const PDF='presentacion-andina.pdf',app=document.getElementById('app'),frame=document.getElementById('pdfFrame'),loading=document.getElementById('loading'),message=document.getElementById('message'),loadingText=document.getElementById('loadingText'),pageEl=document.getElementById('page'),totalEl=document.getElementById('total'),thumbs=document.getElementById('thumbs'),workspace=document.getElementById('workspace'),fullBtn=document.getElementById('full'),toggleBtn=document.getElementById('thumbToggle'),menuBtn=document.getElementById('menuToggle'),menuFab=document.getElementById('menuFab');let page=1,total=0,thumbsHidden=false,zoom=1,loaded=false,timeout;function stop(){loading.style.display='none'}function makeSrc(n){return PDF+'#page='+n+'&view=Fit'}function go(n){if(!total)n=1;page=Math.max(1,Math.min(n,total||9999));pageEl.textContent=page;frame.src=makeSrc(page);document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('active',i===page-1))}function buildList(){thumbs.innerHTML='';if(!total)return;for(let i=1;i<=total;i++){const b=document.createElement('button');b.className='thumb'+(i===page?' active':'');b.type='button';b.innerHTML='<span class="thumb-num">'+i+'</span><span class="thumb-label">Diapositiva '+i+'</span>';b.onclick=()=>go(i);thumbs.append(b)}}function toggleThumbs(){thumbsHidden=!thumbsHidden;thumbs.classList.toggle('hidden',thumbsHidden);workspace.classList.toggle('no-thumbs',thumbsHidden);toggleBtn.textContent=thumbsHidden?'▣ Mostrar páginas':'▣ Ocultar páginas'}function toggleMenu(){const hidden=app.classList.toggle('menu-hidden');menuBtn.textContent=hidden?'☰ Mostrar menú':'☰ Ocultar menú';menuFab.textContent=hidden?'☰ Mostrar menú':'☰ Ocultar menú'}async function toggleFullscreen(){try{if(document.fullscreenElement||document.webkitFullscreenElement){if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}else if(app.requestFullscreen)await app.requestFullscreen();else if(app.webkitRequestFullscreen)app.webkitRequestFullscreen();else app.classList.toggle('presentation-fallback')}catch(e){app.classList.toggle('presentation-fallback')}}function updateFull(){fullBtn.textContent=(document.fullscreenElement||document.webkitFullscreenElement||app.classList.contains('presentation-fallback'))?'⛶ Salir de pantalla completa':'⛶ Pantalla completa'}function fail(){if(loaded)return;clearTimeout(timeout);stop();message.style.display='grid'}function start(){loadingText.textContent='Abriendo presentación…';frame.src=makeSrc(1);frame.onload=function(){loaded=true;clearTimeout(timeout);stop()};timeout=setTimeout(function(){if(!loaded){loadingText.textContent='El PDF está tardando…';setTimeout(fail,4500)}},7000)}document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);document.getElementById('back').onclick=()=>go(page-1);document.getElementById('forward').onclick=()=>go(page+1);document.getElementById('first').onclick=()=>go(1);document.getElementById('last').onclick=()=>go(total||1);document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(2,zoom+.1);frame.style.transform='scale('+zoom+')'};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.6,zoom-.1);frame.style.transform='scale('+zoom+')'};toggleBtn.onclick=toggleThumbs;menuBtn.onclick=toggleMenu;menuFab.onclick=toggleMenu;fullBtn.onclick=toggleFullscreen;document.addEventListener('fullscreenchange',updateFull);document.addEventListener('webkitfullscreenchange',updateFull);window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(page+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(page-1)}if(e.key==='Home')go(1);if(e.key==='End')go(total||1);if(e.key==='m'||e.key==='M')toggleMenu();if(e.key==='Escape'&&app.classList.contains('presentation-fallback'))app.classList.remove('presentation-fallback')});document.addEventListener('DOMContentLoaded',()=>{try{const saved=Number(localStorage.getItem('andina-presentation-total'));if(saved>0){total=saved;totalEl.textContent=total;buildList()}}catch(e){}start()});})();</script></body></html>
