<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Andina Explora · Presentación</title>
<style>
:root{--green:#173c31;--gold:#e7bd45;--bg:#080b09;--line:#303a35;--text:#f5f4ed}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{height:100dvh;width:100%;display:grid;grid-template-rows:50px 1fr 50px;background:#080b09}.app.menu-hidden{grid-template-rows:1fr}.app.menu-hidden .topbar,.app.menu-hidden .bottom{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--green);border-bottom:1px solid #ffffff26;z-index:20}.brand{font-weight:900;letter-spacing:.06em;font-size:.85rem}.top-actions{display:flex;gap:6px}.tool{border:1px solid #ffffff40;background:#ffffff17;color:#fff;border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.75rem}
.workspace{position:relative;min-height:0;display:grid;grid-template-columns:170px 1fr;background:#050705}.workspace.no-thumbs{grid-template-columns:1fr}.thumbs{overflow:auto;background:#151b18;border-right:1px solid var(--line);padding:8px}.thumbs.hidden{display:none}.thumb{display:flex;align-items:center;gap:8px;width:100%;border:2px solid transparent;border-radius:7px;background:#252b28;color:#fff;padding:10px 8px;margin:0 0 8px;cursor:pointer;font-weight:800;text-align:left}.thumb.active{border-color:var(--gold);background:#303b35}.thumb-num{font-size:13px;min-width:28px;text-align:center;color:var(--gold)}.thumb-label{font-size:12px}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#111713;padding:10px 54px;display:flex;align-items:center;justify-content:center}.workspace.no-thumbs .stage{padding:6px 18px}.slide-wrap{position:relative;width:100%;height:100%;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}.slide-canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;background:#fff;box-shadow:0 8px 35px #0008}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:72px;border:0;border-radius:10px;background:#080d0be8;color:#fff;font-size:44px;cursor:pointer;z-index:8}#prev{left:4px}#next{right:4px}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#101511;z-index:15;font-weight:800}.loading.hide{display:none}.loading-box{text-align:center}.spinner{width:30px;height:30px;border:4px solid #ffffff33;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
.error{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:25px;z-index:16}.error.show{display:grid}.error div{max-width:520px;background:#f3ead8;color:#17231e;padding:24px;border-radius:15px}.error a{display:inline-block;margin-top:10px;background:#173c31;color:#fff;border-radius:8px;padding:10px 14px;text-decoration:none;font-weight:800}
.bottom{display:flex;align-items:center;justify-content:center;gap:6px;background:#151b18;border-top:1px solid var(--line);z-index:20}.bottom button{height:36px;min-width:36px;border:1px solid #46524c;background:#252d29;color:#fff;border-radius:8px;font-size:19px;cursor:pointer}.page-info{min-width:80px;text-align:center;font-weight:800;font-size:.82rem}.bottom .tool{height:36px}#thumbToggle,#menuToggle{min-width:145px;background:#2d3a34;border-color:var(--gold)}
.menu-fab{position:absolute;right:14px;top:12px;z-index:25;border:1px solid var(--gold);background:#173c31ee;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:0 5px 20px #0008}
@media(max-width:700px){.app{grid-template-rows:45px 1fr 50px}.thumbs{display:none!important}.workspace,.workspace.no-thumbs{grid-template-columns:1fr}.stage,.workspace.no-thumbs .stage{padding:4px 32px}.navbtn{width:32px;height:52px;font-size:29px}#prev{left:2px}#next{right:2px}.brand{font-size:.56rem}.top-actions .tool:last-child{display:none}.tool{font-size:.58rem;padding:6px 7px}.bottom{gap:3px}.bottom button{min-width:32px;height:34px;font-size:16px}.page-info{min-width:52px;font-size:.68rem}.bottom .tool{min-width:38px;width:auto;padding:5px 7px;font-size:.62rem!important}#thumbToggle,#menuToggle{min-width:38px}.menu-fab{right:7px;top:7px;padding:8px 10px;font-size:.7rem}}
</style>
  <link rel="stylesheet" href="diapositivas-dinamicas.css?v=20260915-2">
</head>
<body>
<div class="app" id="app">
<header class="topbar"><div class="brand">ANDINA <b>EXPLORA</b> · PRESENTACIÓN</div><div class="top-actions"><a class="tool" href="index.html">← Volver</a><button class="tool" id="full" type="button">⛶ Pantalla completa</button><a class="tool" href="presentacion-andina.pdf" target="_blank" rel="noopener">PDF ↗</a></div></header>
<section class="workspace" id="workspace"><aside class="thumbs" id="thumbs" aria-label="Lista de diapositivas"></aside>
<main class="stage" id="stage"><div class="loading" id="loading"><div class="loading-box"><div class="spinner"></div><div id="loadingText">Cargando diapositivas…</div></div></div><div class="error" id="error"><div><h2>No se pudo cargar el visor</h2><p>La presentación sigue disponible como PDF.</p><a href="presentacion-andina.pdf" target="_blank" rel="noopener">Abrir PDF</a></div></div><div class="slide-wrap"><canvas id="slide" class="slide-canvas"></canvas></div><button class="navbtn" id="prev" aria-label="Diapositiva anterior">‹</button><button class="navbtn" id="next" aria-label="Siguiente diapositiva">›</button><button class="menu-fab" id="menuFab" type="button">☰ Ocultar menú</button></main></section>
<footer class="bottom"><button id="first">⏮</button><button id="back">←</button><div class="page-info"><span id="page">1</span> / <span id="total">—</span></div><button id="forward">→</button><button id="last">⏭</button><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="thumbToggle" class="tool">▣ Ocultar páginas</button><button id="menuToggle" class="tool">☰ Ocultar menú</button></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
'use strict';
const PDF='presentacion-andina.pdf',app=document.getElementById('app'),canvas=document.getElementById('slide'),ctx=canvas.getContext('2d'),loading=document.getElementById('loading'),loadingText=document.getElementById('loadingText'),error=document.getElementById('error'),workspace=document.getElementById('workspace'),thumbs=document.getElementById('thumbs'),pageEl=document.getElementById('page'),totalEl=document.getElementById('total'),thumbToggle=document.getElementById('thumbToggle'),menuToggle=document.getElementById('menuToggle'),menuFab=document.getElementById('menuFab');
let pdfDoc=null,page=1,total=0,zoom=1,renderToken=0,thumbsHidden=false;
function hideLoading(){loading.classList.add('hide')}
function showError(){hideLoading();error.classList.add('show')}
function fitScale(p){const v=p.getViewport({scale:1});const stage=document.getElementById('stage');const maxW=Math.max(200,stage.clientWidth-8);const maxH=Math.max(160,stage.clientHeight-8);return Math.max(.1,Math.min(maxW/v.width,maxH/v.height)*zoom)}
async function renderPage(n){if(!pdfDoc)return;page=Math.max(1,Math.min(n,total));pageEl.textContent=page;const token=++renderToken;try{const p=await pdfDoc.getPage(page);if(token!==renderToken)return;const scale=fitScale(p);const viewport=p.getViewport({scale});const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(viewport.width*dpr);canvas.height=Math.floor(viewport.height*dpr);canvas.style.width=Math.floor(viewport.width)+'px';canvas.style.height=Math.floor(viewport.height)+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,viewport.width,viewport.height);await p.render({canvasContext:ctx,viewport}).promise;document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('active',i===page-1));hideLoading()}catch(e){console.error(e);showError()}}
function go(n){renderPage(n)}
function buildList(){thumbs.innerHTML='';for(let i=1;i<=total;i++){const b=document.createElement('button');b.className='thumb'+(i===1?' active':'');b.type='button';b.innerHTML='<span class="thumb-num">'+i+'</span><span class="thumb-label">Diapositiva '+i+'</span>';b.onclick=()=>go(i);thumbs.append(b)}}
function toggleThumbs(){thumbsHidden=!thumbsHidden;thumbs.classList.toggle('hidden',thumbsHidden);workspace.classList.toggle('no-thumbs',thumbsHidden);thumbToggle.textContent=thumbsHidden?'▣ Mostrar páginas':'▣ Ocultar páginas';setTimeout(()=>renderPage(page),80)}
function toggleMenu(){const hidden=app.classList.toggle('menu-hidden');const label=hidden?'☰ Mostrar menú':'☰ Ocultar menú';menuToggle.textContent=label;menuFab.textContent=label;setTimeout(()=>renderPage(page),80)}
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(app.requestFullscreen){await app.requestFullscreen()}else if(app.webkitRequestFullscreen){app.webkitRequestFullscreen()}}catch(e){app.style.position='fixed';app.style.inset='0';app.style.zIndex='99999';setTimeout(()=>renderPage(page),100)}}
document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);document.getElementById('back').onclick=()=>go(page-1);document.getElementById('forward').onclick=()=>go(page+1);document.getElementById('first').onclick=()=>go(1);document.getElementById('last').onclick=()=>go(total);document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(2,zoom+.1);renderPage(page)};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.7,zoom-.1);renderPage(page)};thumbToggle.onclick=toggleThumbs;menuToggle.onclick=toggleMenu;menuFab.onclick=toggleMenu;document.getElementById('full').onclick=fullscreen;
window.addEventListener('resize',()=>{if(pdfDoc)renderPage(page)});document.addEventListener('fullscreenchange',()=>setTimeout(()=>renderPage(page),100));window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(page+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(page-1)}if(e.key==='Home')go(1);if(e.key==='End')go(total);if(e.key==='m'||e.key==='M')toggleMenu()});
async function init(){try{if(!window.pdfjsLib)throw new Error('PDF.js no disponible');loadingText.textContent='Abriendo presentación…';const response=await fetch(PDF,{cache:'no-store'});if(!response.ok)throw new Error('PDF HTTP '+response.status);const data=await response.arrayBuffer();loadingText.textContent='Preparando diapositivas…';pdfDoc=await window.pdfjsLib.getDocument({data:data,disableWorker:true}).promise;total=pdfDoc.numPages;totalEl.textContent=total;buildList();await renderPage(1)}catch(e){console.error(e);showError()}}
setTimeout(()=>{if(!pdfDoc)showError()},15000);init();
})();
</script>
</body>
</html>
