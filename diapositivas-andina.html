<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Andina Explora · Presentación</title>
<style>
:root{--green:#173c31;--gold:#e7bd45;--bg:#080b09;--line:#303a35;--text:#f5f4ed}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{height:100dvh;width:100%;display:grid;grid-template-rows:50px 1fr 50px;background:#080b09}.app.menu-hidden{grid-template-rows:1fr}.app.menu-hidden .topbar,.app.menu-hidden .bottom{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:var(--green);border-bottom:1px solid #ffffff26;z-index:20}.brand{font-weight:900;letter-spacing:.06em;font-size:.85rem}.top-actions{display:flex;gap:6px}.tool{border:1px solid #ffffff40;background:#ffffff17;color:#fff;border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.75rem}
.workspace{position:relative;min-height:0;display:grid;grid-template-columns:170px 1fr;background:#050705}.workspace.no-thumbs{grid-template-columns:1fr}.thumbs{overflow:auto;background:#151b18;border-right:1px solid var(--line);padding:8px}.thumbs.hidden{display:none}.thumb{display:flex;align-items:center;gap:8px;width:100%;border:2px solid transparent;border-radius:7px;background:#252b28;color:#fff;padding:10px 8px;margin:0 0 8px;cursor:pointer;font-weight:800;text-align:left}.thumb.active{border-color:var(--gold);background:#303b35}.thumb-num{font-size:13px;min-width:28px;text-align:center;color:var(--gold)}.thumb-label{font-size:12px}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#111713;padding:0 44px;display:flex}.workspace.no-thumbs .stage{padding:0 8px}.slide-wrap{position:relative;width:100%;height:100%;min-width:0;min-height:0;display:flex}.pdf-frame{width:100%;height:100%;border:0;background:#fff;display:block}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:72px;border:0;border-radius:10px;background:#080d0be8;color:#fff;font-size:44px;cursor:pointer;z-index:8}#prev{left:3px}#next{right:3px}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#101511;z-index:15;font-weight:800}.loading.hide{display:none}.loading-box{text-align:center}.spinner{width:30px;height:30px;border:4px solid #ffffff33;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
.bottom{display:flex;align-items:center;justify-content:center;gap:6px;background:#151b18;border-top:1px solid var(--line);z-index:20}.bottom button{height:36px;min-width:36px;border:1px solid #46524c;background:#252d29;color:#fff;border-radius:8px;font-size:19px;cursor:pointer}.page-info{min-width:80px;text-align:center;font-weight:800;font-size:.82rem}.bottom .tool{height:36px}#thumbToggle,#menuToggle{min-width:145px;background:#2d3a34;border-color:var(--gold)}
.menu-fab{position:absolute;right:14px;top:12px;z-index:25;border:1px solid var(--gold);background:#173c31ee;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;box-shadow:0 5px 20px #0008}.app.menu-hidden .menu-fab{display:block}
.open-direct{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:16;display:none;background:#173c31;color:#fff;border:2px solid var(--gold);padding:13px 18px;border-radius:12px;font-weight:900;text-decoration:none}.open-direct.show{display:block}
@media(max-width:700px){.app{grid-template-rows:45px 1fr 50px}.thumbs{display:none!important}.workspace,.workspace.no-thumbs{grid-template-columns:1fr}.stage,.workspace.no-thumbs .stage{padding:0 26px}.navbtn{width:32px;height:52px;font-size:29px}#prev{left:2px}#next{right:2px}.brand{font-size:.56rem}.top-actions .tool:last-child{display:none}.tool{font-size:.58rem;padding:6px 7px}.bottom{gap:3px}.bottom button{min-width:32px;height:34px;font-size:16px}.page-info{min-width:52px;font-size:.68rem}.bottom .tool{min-width:38px;width:auto;padding:5px 7px;font-size:.62rem!important}#thumbToggle,#menuToggle{min-width:38px}.menu-fab{right:7px;top:7px;padding:8px 10px;font-size:.7rem}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar"><div class="brand">ANDINA <b>EXPLORA</b> · PRESENTACIÓN</div><div class="top-actions"><a class="tool" href="index.html">← Volver</a><button class="tool" id="full" type="button">⛶ Pantalla completa</button><a class="tool" href="presentacion-andina.pdf" target="_blank" rel="noopener">PDF ↗</a></div></header>
<section class="workspace" id="workspace">
<aside class="thumbs" id="thumbs" aria-label="Lista de páginas"></aside>
<main class="stage" id="stage">
<div class="loading" id="loading"><div class="loading-box"><div class="spinner"></div><div>Preparando las diapositivas…</div></div></div>
<div class="slide-wrap"><iframe id="pdfFrame" class="pdf-frame" title="Presentación Región Andina" allow="fullscreen" loading="eager"></iframe></div>
<a class="open-direct" id="openDirect" href="presentacion-andina.pdf" target="_blank" rel="noopener">Abrir presentación</a>
<button class="navbtn" id="prev" aria-label="Página anterior">‹</button><button class="navbtn" id="next" aria-label="Página siguiente">›</button>
<button class="menu-fab" id="menuFab" type="button">☰ Ocultar menú</button>
</main></section>
<footer class="bottom"><button id="first">⏮</button><button id="back">←</button><div class="page-info"><span id="page">1</span> / <span id="total">10</span></div><button id="forward">→</button><button id="last">⏭</button><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="thumbToggle" class="tool">▣ Ocultar páginas</button><button id="menuToggle" class="tool">☰ Ocultar menú</button></footer>
</div>
<script>
(function(){
const PDF='presentacion-andina.pdf';
const app=document.getElementById('app'),frame=document.getElementById('pdfFrame'),loading=document.getElementById('loading'),openDirect=document.getElementById('openDirect'),workspace=document.getElementById('workspace'),thumbs=document.getElementById('thumbs'),pageEl=document.getElementById('page'),totalEl=document.getElementById('total'),thumbToggle=document.getElementById('thumbToggle'),menuToggle=document.getElementById('menuToggle'),menuFab=document.getElementById('menuFab');
const total=10;let page=1,thumbsHidden=false,zoom=1;
const publicPdf=location.origin+location.pathname.replace(/diapositivas-andina\.html$/,'')+PDF;
const viewer='https://docs.google.com/gview?embedded=1&url='+encodeURIComponent(publicPdf);
function hideLoading(){loading.classList.add('hide')}
function setPage(n){page=Math.max(1,Math.min(total,n));pageEl.textContent=page;frame.src=viewer+'#page='+page;document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('active',i===page-1))}
function buildList(){for(let i=1;i<=total;i++){const b=document.createElement('button');b.className='thumb'+(i===1?' active':'');b.type='button';b.innerHTML='<span class="thumb-num">'+i+'</span><span class="thumb-label">Diapositiva '+i+'</span>';b.onclick=()=>setPage(i);thumbs.append(b)}}
function toggleThumbs(){thumbsHidden=!thumbsHidden;thumbs.classList.toggle('hidden',thumbsHidden);workspace.classList.toggle('no-thumbs',thumbsHidden);thumbToggle.textContent=thumbsHidden?'▣ Mostrar páginas':'▣ Ocultar páginas'}
function toggleMenu(){const hidden=app.classList.toggle('menu-hidden');const label=hidden?'☰ Mostrar menú':'☰ Ocultar menú';menuToggle.textContent=label;menuFab.textContent=label}
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(app.requestFullscreen){await app.requestFullscreen()}else if(app.webkitRequestFullscreen){app.webkitRequestFullscreen()}}catch(e){app.style.position='fixed';app.style.inset='0';app.style.zIndex='99999'}}
document.getElementById('prev').onclick=()=>setPage(page-1);document.getElementById('next').onclick=()=>setPage(page+1);document.getElementById('back').onclick=()=>setPage(page-1);document.getElementById('forward').onclick=()=>setPage(page+1);document.getElementById('first').onclick=()=>setPage(1);document.getElementById('last').onclick=()=>setPage(total);thumbToggle.onclick=toggleThumbs;menuToggle.onclick=toggleMenu;menuFab.onclick=toggleMenu;document.getElementById('full').onclick=fullscreen;
document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(1.25,zoom+.05);frame.style.transform='scale('+zoom+')';frame.style.transformOrigin='center center'};document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(.8,zoom-.05);frame.style.transform='scale('+zoom+')';frame.style.transformOrigin='center center'};
frame.addEventListener('load',hideLoading);
setTimeout(hideLoading,2500);setTimeout(()=>{if(frame.contentDocument&&frame.contentDocument.body&&frame.contentDocument.body.innerText.trim()===''){openDirect.classList.add('show')}},9000);
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();setPage(page+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();setPage(page-1)}if(e.key==='Home')setPage(1);if(e.key==='End')setPage(total);if(e.key==='m'||e.key==='M')toggleMenu()});
buildList();setPage(1);
})();
</script>
</body>
</html>
