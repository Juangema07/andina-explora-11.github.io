<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Andina Explora · Presentación</title>
<style>
:root{--green:#173c31;--gold:#e7bd45;--bg:#111714;--panel:#19201d;--line:#303a35;--text:#f5f4ed}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{height:100dvh;display:grid;grid-template-rows:58px 1fr 64px;background:#101512}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--green);border-bottom:1px solid rgba(255,255,255,.15);z-index:10}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:var(--gold)}.top-actions{display:flex;gap:7px}.tool{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.78rem}.tool:hover{background:rgba(255,255,255,.16)}
.workspace{min-height:0;display:grid;grid-template-columns:175px 1fr;background:#0d110f}.thumbs{overflow:auto;background:#171d1a;border-right:1px solid var(--line);padding:12px 10px}.thumb{display:block;width:100%;border:2px solid transparent;border-radius:7px;background:#252b28;padding:4px;margin-bottom:10px;cursor:pointer;position:relative}.thumb.active{border-color:var(--gold);background:#313934}.thumb canvas{display:block;width:100%;height:auto;background:#fff}.thumb span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.75);font-size:11px;padding:2px 5px;border-radius:4px}.stage{min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at center,#29312d 0,#171c19 55%,#0d110f 100%)}.slide-wrap{position:relative;display:flex;align-items:center;justify-content:center;max-width:calc(100% - 90px);max-height:calc(100% - 40px);transform-origin:center;transition:transform .18s ease}.slide-wrap canvas{display:block;background:#fff;box-shadow:0 12px 45px rgba(0,0,0,.45);max-width:100%;max-height:100%}.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:72px;border:0;border-radius:12px;background:rgba(10,15,13,.75);color:#fff;font-size:40px;line-height:1;cursor:pointer;z-index:4}.navbtn:hover{background:rgba(10,15,13,.95)}#prev{left:14px}#next{right:14px}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#111714;z-index:8;font-weight:800}.message{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:7}.message div{max-width:550px;background:#f3ead8;color:#17231e;padding:25px;border-radius:16px}.bottom{display:flex;align-items:center;justify-content:center;gap:12px;background:#171d1a;border-top:1px solid var(--line);z-index:10}.bottom button{width:42px;height:42px;border:1px solid #46524c;background:#252d29;color:#fff;border-radius:9px;font-size:22px;cursor:pointer}.bottom button:hover{background:#303b35}.page-info{min-width:110px;text-align:center;font-weight:800;font-size:.9rem}.zoom{font-size:.75rem;color:#cbd2ce;margin-left:5px}.gold{color:var(--gold)}
@media(max-width:700px){.app{grid-template-rows:52px 1fr 58px}.topbar{padding:7px 9px}.brand{font-size:.65rem}.tool{font-size:.63rem;padding:7px 8px}.thumbs{display:none}.slide-wrap{max-width:calc(100% - 64px);max-height:calc(100% - 30px)}.navbtn{width:38px;height:58px;font-size:31px}#prev{left:6px}#next{right:6px}.bottom{gap:7px}.bottom button{width:38px;height:38px}.page-info{min-width:85px;font-size:.75rem}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="topbar"><div class="brand">ANDINA <b>EXPLORA</b> · PRESENTACIÓN</div><div class="top-actions"><a class="tool" href="index.html">← Volver</a><button class="tool" id="full" type="button">⛶ Pantalla completa</button><a class="tool" href="presentacion-andina.pdf" target="_blank" rel="noopener">PDF ↗</a></div></header>
<section class="workspace">
<aside class="thumbs" id="thumbs" aria-label="Miniaturas de diapositivas"></aside>
<main class="stage" id="stage"><div class="loading" id="loading">Preparando las diapositivas…</div><div class="message" id="message"><div><h2>No se pudo cargar el visor</h2><p>La presentación sigue disponible como PDF.</p><a class="tool" href="presentacion-andina.pdf" target="_blank" rel="noopener">Abrir PDF</a></div></div><button class="navbtn" id="prev" aria-label="Diapositiva anterior">‹</button><div class="slide-wrap" id="slideWrap"><canvas id="canvas"></canvas></div><button class="navbtn" id="next" aria-label="Diapositiva siguiente">›</button></main>
</section>
<footer class="bottom"><button id="first" title="Primera diapositiva">⏮</button><button id="back" title="Anterior">←</button><div class="page-info"><span id="page">1</span> / <span id="total">—</span><span class="zoom"> · <span class="gold">A</span> para ajustar</span></div><button id="forward" title="Siguiente">→</button><button id="last" title="Última diapositiva">⏭</button><button id="zoomOut" title="Alejar">−</button><button id="zoomIn" title="Acercar">+</button></footer>
</div>
<script type="module">
const PDF='presentacion-andina.pdf';
const stage=document.getElementById('stage'),wrap=document.getElementById('slideWrap'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const loading=document.getElementById('loading'),message=document.getElementById('message'),pageEl=document.getElementById('page'),totalEl=document.getElementById('total'),thumbs=document.getElementById('thumbs');
let pdf=null,page=1,zoom=1,baseScale=1,busy=false;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
async function render(){if(!pdf||busy)return;busy=true;try{const p=await pdf.getPage(page);const base=p.getViewport({scale:1});const availableW=stage.clientWidth-(innerWidth<=700?70:215);const availableH=stage.clientHeight-28;baseScale=Math.min(availableW/base.width,availableH/base.height);const scale=clamp(baseScale*zoom,.25,3);const vp=p.getViewport({scale});canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);wrap.style.width=canvas.width+'px';wrap.style.height=canvas.height+'px';await p.render({canvasContext:ctx,viewport:vp}).promise;pageEl.textContent=page;totalEl.textContent=pdf.numPages;document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('active',i===page-1));stage.scrollTop=0;stage.scrollLeft=0;}catch(e){console.error(e)}finally{busy=false;loading.style.display='none'}}
async function makeThumb(n){const p=await pdf.getPage(n);const vp=p.getViewport({scale:1});const max=150;const s=max/vp.width;const v=p.getViewport({scale:s});const b=document.createElement('canvas');b.width=Math.ceil(v.width);b.height=Math.ceil(v.height);await p.render({canvasContext:b.getContext('2d'),viewport:v}).promise;const d=document.createElement('button');d.className='thumb'+(n===1?' active':'');d.type='button';d.title='Diapositiva '+n;d.appendChild(b);const sp=document.createElement('span');sp.textContent=n;d.appendChild(sp);d.onclick=()=>{page=n;zoom=1;render()};thumbs.appendChild(d)}
function go(n){if(!pdf)return;page=clamp(n,1,pdf.numPages);zoom=1;render()}
async function init(){try{const lib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';pdf=await lib.getDocument(PDF).promise;totalEl.textContent=pdf.numPages;await render();for(let i=1;i<=pdf.numPages;i++)await makeThumb(i)}catch(e){console.error(e);loading.style.display='none';message.style.display='grid'}}
document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);document.getElementById('back').onclick=()=>go(page-1);document.getElementById('forward').onclick=()=>go(page+1);document.getElementById('first').onclick=()=>go(1);document.getElementById('last').onclick=()=>go(pdf?pdf.numPages:1);document.getElementById('zoomIn').onclick=()=>{zoom=clamp(zoom+.15,.5,2.5);render()};document.getElementById('zoomOut').onclick=()=>{zoom=clamp(zoom-.15,.5,2.5);render()};document.getElementById('full').onclick=()=>document.getElementById('app').requestFullscreen?.();
window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(page+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(page-1)}if(e.key==='Home')go(1);if(e.key==='End')go(pdf?pdf.numPages:1);if(e.key.toLowerCase()==='a'){zoom=1;render()}if(e.key==='+'||e.key==='='){zoom=clamp(zoom+.15,.5,2.5);render()}if(e.key==='-'){zoom=clamp(zoom-.15,.5,2.5);render()}});
let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(()=>render(),120)});init();
</script>
</body>
</html>
