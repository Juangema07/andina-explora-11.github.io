<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Andina Explora · Presentación</title><style>:root{--green:#173c31;--gold:#e7bd45;--bg:#080b09;--line:#303a35;--text:#f5f4ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.app{height:100dvh;width:100%;display:grid;grid-template-rows:52px 1fr 54px;background:#080b09}.app:fullscreen{height:100vh;width:100vw}.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--green);border-bottom:1px solid rgba(255,255,255,.15);z-index:20}.brand{font-weight:900;letter-spacing:.08em;font-size:.9rem}.brand b{color:var(--gold)}.top-actions{display:flex;gap:6px}.tool{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.09);color:#fff;border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.76rem}.workspace{position:relative;min-height:0;display:grid;grid-template-columns:190px 1fr;background:#050705}.thumbs{min-width:0;overflow:auto;background:#151b18;border-right:1px solid var(--line);padding:9px 8px;transition:all .18s ease}.thumbs.hidden{display:none}.workspace.no-thumbs{grid-template-columns:1fr}.thumb{display:block;width:100%;border:2px solid transparent;border-radius:7px;background:#252b28;padding:3px;margin:0 0 8px;cursor:pointer;position:relative}.thumb.active{border-color:var(--gold)}.thumb canvas{display:block;width:100%;height:auto;background:#fff}.thumb span{position:absolute;left:5px;bottom:5px;background:#000c;font-size:10px;padding:2px 5px;border-radius:4px}.stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at center,#303934 0,#181e1a 55%,#070a08 100%);padding:2px 46px}.workspace.no-thumbs .stage{padding:2p t-size:.58rem}.top-actions{gap:4px}.tool{font-size:.58rem;padding:7px}.top-actions .tool:last-child{display:none}.thumbs{display:none!important}.workspace,.workspace.no-thumbs{grid-template-columns:1fr}.stage,.workspace.no-thumbs .stage{padding:2px 35px}.navbtn{width:34px;height:55px;font-size:30px}#prev{left:3px}#next{right:3px}.bottom{gap:4px}.bottom button{min-width:34px;height:36px;font-size:17px}.page-info{min-width:65px;font-size:.7rem}.bottom .tool{min-width:36px;width:36px;padding:5px;font-size:0}.bottom .tool .hide-icon{font-size:17px}}@media(min-width:701px){.app:fullscreen .brand{font-size:1rem}.app:fullscreen .topbar{height:56px}.app:fullscreen .bottom{height:58px}.app:fullscreen .stage{background:#050705}.app:fullscreen .navbtn{width:56px;height:82px;font-size:48px}}</style></head><body><div class="app" id="app"><header class="topbar"><div class="brand">ANDINA <b>EXPLORA</b> · PRESENTACIÓN</div><div class="top-actions"><a class="tool" href="index.html">← Volver</a><button class="tool" id="full" type="button">⛶ Pantalla completa</button><a class="tool" href="presentacion-andina.pdf" target="_blank" rel="noopener">PDF ↗</a></div></header><section class="workspace" id="workspace"><aside class="thumbs" id="thumbs" aria-label="Miniaturas de las páginas"></aside><main class="stage" id="stage"><div class="loading" id="loading"><div class="loading-box"><div class="spinner"></div><div id="loadingText">Cargando presentación…</div></div></div><div class="message" id="message"><div><h2>No se pudo cargar el visor</h2><p>La presentación sigue disponible como PDF.</p><a class="tool" href="presentacion-andina.pdf" target="_blank" rel="noopener">Abrir PDF</a></div></div><button class="navbtn" id="prev" aria-label="Diapositiva anterior">‹</button><div class="slide-wrap" id="slideWrap"><canvas id="canvas"></canvas></div><button class="navbtn" id="next" aria-label="Diapositiva siguiente">›</button></main></section><footer class="bottom"><button id="first" aria-label="Primera diapositiva">⏮</button><button id="back" aria-label="Anterior">←</button><div class="page-info"><span id="page">1</span> / <span id="total">—</span></div><button id="forward" aria-label="Siguiente">→</button><button id="last" aria-label="Última diapositiva">⏭</button><button id="zoomOut" aria-label="Alejar">−</button><button id="zoomIn" aria-label="Acercar">+</button><button id="thumbToggle" class="tool" type="button"><span class="hide-icon">▣</span> Ocultar páginas</button></footer></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>const PDF='presentacion-andina.pdf',app=document.getElementById('app'),stage=document.getElementById('stage'),wrap=document.getElementById('slideWrap'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false}),loading=document.getElementById('loading'),message=document.getElementById('message'),loadingText=document.getElementById('loadingText'),pageEl=document.getElementById('page'),totalEl=document.getElementById('total'),thumbs=document.getElementById('thumbs'),workspace=document.getElementById('workspace'),fullBtn=document.getElementById('full'),toggleBtn=document.getElementById('thumbToggle');let pdf=null,page=1,zoom=1,busy=false,failed=false,thumbsHidden=false;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function stop(){loading.style.display='none'}function error(){if(failed)return;failed=true;stop();message.style.display='grid'}function render(){if(!pdf||busy||failed)return;busy=true;pdf.getPage(page).then(p=>{const base=p.getViewport({scale:1});const sw=stage.clientWidth,sh=stage.clientHeight;const side=thumbsHidden?8:12;const aw=Math.max(200,sw-side-8),ah=Math.max(120,sh-6);const fit=Math.min(aw/base.width,ah/base.height);const scale=clamp(fit*zoom,.2,5);const v=p.getViewport({scale});canvas.width=Math.ceil(v.width);canvas.height=Math.ceil(v.height);canvas.style.width=Math.ceil(v.width)+'px';canvas.style.height=Math.ceil(v.height)+'px';return p.render({canvasContext:ctx,viewport:v}).promise.then(()=>{pageEl.textContent=page;totalEl.textContent=pdf.numPages;document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('active',i===page-1));stop()})}).catch(e=>{console.error(e);error()}).finally(()=>{busy=false})}function thumb(n){pdf.getPage(n).then(p=>{const v0=p.getViewport({scale:1}),v=p.getViewport({scale:150/v0.width}),c=document.createElement('canvas');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);return p.render({canvasContext:c.getContext('2d'),viewport:v}).promise.then(()=>{const b=document.createElement('button');b.className='thumb'+(n===1?' active':'');b.type='button';b.append(c);const s=document.createElement('span');s.textContent=n;b.append(s);b.onclick=()=>{page=n;zoom=1;render()};thumbs.append(b)})}).catch(e=>console.warn('Miniatura',n,e))}function go(n){if(!pdf)return;page=clamp(n,1,pdf.numPages);zoom=1;render()}function toggleThumbs(){thumbsHidden=!thumbsHidden;thumbs.classList.toggle('hidden',thumbsHidden);workspace.classList.toggle('no-thumbs',thumbsHidden);toggleBtn.innerHTML=thumbsHidden?'<span class="hide-icon">▣</span> Mostrar páginas':'<span class="hide-icon">▣</span> Ocultar páginas';setTimeout(render,80)}async function toggleFullscreen(){try{if(!isFull()){if(app.requestFullscreen)await app.requestFullscreen();else if(app.webkitRequestFullscreen)app.webkitRequestFullscreen();else{app.classList.add('presentation-fallback');document.body.classList.add('presentation-fallback')}}else{if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();app.classList.remove('presentation-fallback');document.body.classList.remove('presentation-fallback')}}catch(e){console.warn(e);app.classList.toggle('presentation-fallback')}}function isFull(){return !!(document.fullscreenElement||document.webkitFullscreenElement||app.classList.contains('presentation-fallback'))}function updateFullscreenLabel(){fullBtn.textContent=isFull()?'⛶ Salir de pantalla completa':'⛶ Pantalla completa';setTimeout(render,100)}async function init(){if(!window.pdfjsLib){loadingText.textContent='No se pudo iniciar el visor';setTimeout(error,500);return}try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';loadingText.textContent='Abriendo PDF…';pdf=await pdfjsLib.getDocument({url:PDF,disableAutoFetch:false}).promise;totalEl.textContent=pdf.numPages;render();for(let i=1;i<=pdf.numPages;i++)setTimeout(()=>thumb(i),i*35)}catch(e){console.error(e);error()}}document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);document.getElementById('back').onclick=()=>go(page-1);document.getElementById('forward').onclick=()=>go(page+1);document.getElementById('first').onclick=()=>go(1);document.getElementById('last').onclick=()=>go(pdf?pdf.numPages:1);document.getElementById('zoomIn').onclick=()=>{zoom=clamp(zoom+.15,.5,3);render()};document.getElementById('zoomOut').onclick=()=>{zoom=clamp(zoom-.15,.5,3);render()};toggleBtn.onclick=toggleThumbs;fullBtn.onclick=toggleFullscreen;document.addEventListener('fullscreenchange',updateFullscreenLabel);document.addEventListener('webkitfullscreenchange',updateFullscreenLabel);window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(page+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(page-1)}if(e.key==='Home')go(1);if(e.key==='End')go(pdf?pdf.numPages:1);if(e.key.toLowerCase()==='a'){zoom=1;render()}if(e.key==='+'||e.key==='='){zoom=clamp(zoom+.15,.5,3);render()}if(e.key==='-'){zoom=clamp(zoom-.15,.5,3);render()}if(e.key==='Escape'&&isFull()&&!document.fullscreenElement){app.classList.remove('presentation-fallback');document.body.classList.remove('presentation-fallback')}});let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,120)});setTimeout(()=>{if(!pdf&&!failed){loadingText.textContent='El PDF está tardando demasiado…';setTimeout(()=>{if(!pdf)error()},5000)}},10000);init();</script></body></html>
