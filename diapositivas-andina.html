<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Andina Explora · Presentación</title><style>:root{--green:#173c31;--gold:#e7bd45;--bg:#111714;--line:#303a35;--text:#f5f4ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}.app{height:100dvh;display:grid;grid-template-rows:58px 1fr 64px;background:#101512}.app:fullscreen{width:100vw;height:100vh}.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--green);border-bottom:1px solid rgba(255,255,255,.15);z-index:10}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:var(--gold)}.top-actions{display:flex;gap:7px}.tool{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.78rem}.workspace{min-height:0;display:grid;grid-template-columns:175px 1fr;background:#0d110f}.thumbs{overflow:auto;background:#171d1a;border-right:1px solid var(--line);padding:12px 10px}.thumb{display:block;width:100%;border:2px solid transparent;border-radius:7px;background:#252b28;padding:4px;margin-bottom:10px;cursor:pointer;position:relative}.thumb.active{border-color:var(--gold)}.thumb canvas{display:block;width:100%;height:auto;background:#fff}.thumb span{position:absolute;left:6px;bottom:6px;background:#000b;font-size:11px;padding:2px 5px;border-radius:4px}.stage{min-width:0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle,#29312d,#171c19 55%,#0d110f);padding:14px 72px}.slide-wrap{display:flex;align-items:center;justify-content:center;width:min(92vw,1400px);height:min(82vh,900px)}.slide-wrap canvas{display:block;background:#fff;box-shadow:0 12px 45px #0009;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}.app:fullscreen .stage{padding:18px 90px}.app:fullscreen .slide-wrap{width:94vw;height:88vh}.app:fullscreen .thumbs{padding:14px 10px}.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:78px;border:0;border-radius:12px;background:#0a0f0dd9;color:#fff;font-size:44px;cursor:pointer;z-index:4}.navbtn:hover{background:#0a0f0df5}.navbtn:active{transform:translateY(-50%) scale(.96)}#prev{left:12px}#next{right:12px}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#111714;z-index:8;font-weight:800}.loading-box{text-align:center}.spinner{width:32px;height:32px;border:4px solid #ffffff33;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.message{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:9}.message div{max-width:550px;background:#f3ead8;color:#17231e;padding:25px;border-radius:16px}.bottom{display:flex;align-items:center;justify-content:center;gap:12px;background:#171d1a;border-top:1px solid var(--line);z-index:10}.bottom button{width:42px;height:42px;border:1px solid #46524c;background:#252d29;color:#fff;border-radius:9px;font-size:22px;cursor:pointer}.page-info{min-width:110px;text-align:center;font-weight:800;font-size:.9rem}.zoom{font-size:.75rem;color:#cbd2ce;margin-left:5px}.gold{color:var(--gold)}@media(max-width:700px){.app{grid-template-rows:52px 1fr 58px}.topbar{padding:7px 9px}.brand{font-size:.65rem}.tool{font-size:.63rem;padding:7px 8px}.thumbs{display:none}.stage{padding:8px 46px}.slide-wrap{width:96vw;height:calc(100dvh - 130px)}.app:fullscreen .slide-wrap{width:96vw;height:calc(100vh - 120px)}.navbtn{width:38px;height:58px;font-size:31px}#prev{left:5px}#next{right:5px}.bottom{gap:7px}.bottom button{width:38px;height:38px}.page-info{min-width:85px;font-size:.75rem}.zoom{display:none}}
</style></head><body><div class="app" id="app"><header class="topbar"><div class="brand">ANDINA <b>EXPLORA</b> · PRESENTACIÓN</div><div class="top-actions"><a class="tool" href="index.html">← Volver</a><button class="tool" id="full" type="button">⛶ Pantalla completa</button><a class="tool" href="presentacion-andina.pdf" target="_blank" rel="noopener">PDF ↗</a></div></header><section class="workspace"><aside class="thumbs" id="thumbs" aria-label="Miniaturas"></aside><main class="stage" id="stage"><div class="loading" id="loading"><div class="loading-box"><div class="spinner"></div><div id="loadingText">Cargando presentación…</div></div></div><div class="message" id="message"><div><h2>No se pudo cargar el visor</h2><p>La presentación sigue disponible como PDF.</p><a class="tool" href="presentacion-andina.pdf" target="_blank" rel="noopener">Abrir PDF</a></div></div><button class="navbtn" id="prev" aria-label="Diapositiva anterior">‹</button><div class="slide-wrap" id="slideWrap"><canvas id="canvas"></canvas></div><button class="navbtn" id="next" aria-label="Diapositiva siguiente">›</button></main></section><footer class="bottom"><button id="first" aria-label="Primera diapositiva">⏮</button><button id="back" aria-label="Anterior">←</button><div class="page-info"><span id="page">1</span> / <span id="total">—</span><span class="zoom"> · <span class="gold">A</span> para ajustar</span></div><button id="forward" aria-label="Siguiente">→</button><button id="last" aria-label="Última diapositiva">⏭</button><button id="zoomOut" aria-label="Alejar">−</button><button id="zoomIn" aria-label="Acercar">+</button></footer></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
const PDF='presentacion-andina.pdf',app=document.getElementById('app'),stage=document.getElementById('stage'),wrap=document.getElementById('slideWrap'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),loading=document.getElementById('loading'),message=document.getElementById('message'),loadingText=document.getElementById('loadingText'),pageEl=document.getElementById('page'),totalEl=document.getElementById('total'),thumbs=document.getElementById('thumbs'),fullBtn=document.getElementById('full');let pdf=null,page=1,zoom=1,busy=false,failed=false;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function stop(){loading.style.display='none'}function error(){if(failed)return;failed=true;stop();message.style.display='grid'}async function render(){if(!pdf||busy||failed)return;busy=true;try{const p=await pdf.getPage(page),base=p.getViewport({scale:1}),availableW=stage.clientWidth-(innerWidth<=700?72:90),availableH=stage.clientHeight-(innerWidth<=700?20:28),scale=clamp(Math.min(availableW/base.width,availableH/base.height)*zoom,.25,3),v=p.getViewport({scale});canvas.width=Math.ceil(v.width);canvas.height=Math.ceil(v.height);wrap.style.width=Math.min(v.width,stage.clientWidth-(innerWidth<=700?72:90))+'px';wrap.style.height=Math.min(v.height,stage.clientHeight-(innerWidth<=700?20:28))+'px';await p.render({canvasContext:ctx,viewport:v}).promise;pageEl.textContent=page;totalEl.textContent=pdf.numPages;document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('active',i===page-1));stop()}catch(e){console.error(e);error()}finally{busy=false}}async function thumb(n){try{const p=await pdf.getPage(n),v0=p.getViewport({scale:1}),v=p.getViewport({scale:150/v0.width}),c=document.createElement('canvas');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;const b=document.createElement('button');b.className='thumb'+(n===1?' active':'');b.type='button';b.append(c);const s=document.createElement('span');s.textContent=n;b.append(s);b.onclick=()=>{page=n;zoom=1;render()};thumbs.append(b)}catch(e){console.warn(e)}}function go(n){if(!pdf)return;page=clamp(n,1,pdf.numPages);zoom=1;render()}async function toggleFullscreen(){try{if(!document.fullscreenElement){await app.requestFullscreen();}else{await document.exitFullscreen();}}catch(e){console.warn('Fullscreen no disponible',e)}}function updateFullscreenLabel(){fullBtn.textContent=document.fullscreenElement?'⛶ Salir de pantalla completa':'⛶ Pantalla completa';setTimeout(render,80)}async function init(){if(!window.pdfjsLib){loadingText.textContent='No se pudo iniciar el visor';setTimeout(error,500);return}try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';loadingText.textContent='Abriendo PDF…';pdf=await pdfjsLib.getDocument({url:PDF}).promise;totalEl.textContent=pdf.numPages;await render();for(let i=1;i<=pdf.numPages;i++)thumb(i)}catch(e){console.error(e);error()}}document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);document.getElementById('back').onclick=()=>go(page-1);document.getElementById('forward').onclick=()=>go(page+1);document.getElementById('first').onclick=()=>go(1);document.getElementById('last').onclick=()=>go(pdf?pdf.numPages:1);document.getElementById('zoomIn').onclick=()=>{zoom=clamp(zoom+.15,.5,2.5);render()};document.getElementById('zoomOut').onclick=()=>{zoom=clamp(zoom-.15,.5,2.5);render()};fullBtn.onclick=toggleFullscreen;document.addEventListener('fullscreenchange',updateFullscreenLabel);window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(page+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(page-1)}if(e.key==='Home')go(1);if(e.key==='End')go(pdf?pdf.numPages:1);if(e.key.toLowerCase()==='a'){zoom=1;render()}if(e.key==='+'||e.key==='='){zoom=clamp(zoom+.15,.5,2.5);render()}if(e.key==='-'){zoom=clamp(zoom-.15,.5,2.5);render()}if(e.key==='Escape'&&document.fullscreenElement){document.exitFullscreen()}});let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150)});setTimeout(()=>{if(!pdf&&!failed){loadingText.textContent='El PDF está tardando demasiado…';setTimeout(()=>{if(!pdf)error()},5000)}},10000);init();</script></body></html>
